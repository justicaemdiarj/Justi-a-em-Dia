<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termo</title>
    <meta name="robots" content="noindex">
        <link rel="icon" type="images/png" href="img/favicon.png"/>
        <script src="js/offline.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
    --primary: #c70033;
    --primary-dark: #8b0024;
    --border: #e5e5e5;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:linear-gradient(to bottom,#f8f9fa,#e9ecef);
    color:#333;
}

.header{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    padding:3rem 1rem;
    text-align:center;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:2rem 1rem;
}

.form-section{
    background:#ffffff;
    border-radius:18px;
    padding:3rem;
    box-shadow:0 20px 60px rgba(0,0,0,0.06);
    border:1px solid rgba(0,0,0,0.04);
    backdrop-filter:blur(10px);
}

.form-section h2{
    color:var(--primary);
    border-bottom:2px solid var(--primary);
    padding-bottom:.5rem;
    margin-bottom:1.5rem;
}

.form-section h3{
    margin:1.5rem 0 1rem;
    border-left:4px solid var(--primary);
    padding-left:1rem;
}

.form-group{margin-bottom:1.5rem;}

.form-group label{
    font-weight:600;
    font-size:13px;
    letter-spacing:.3px;
    margin-bottom:.4rem;
    display:block;
    color:#444;
    margin-top: 10px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:0.95rem 1rem;
    border:1.5px solid #ddd;
    border-radius:12px;
    background:#fff;
    font-size:14px;
    transition:all .25s ease;
    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(199,0,51,0.1);
    transform:translateY(-1px);
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1rem;
}

.price-options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1rem;
}

.price-option{
    border:2px solid var(--border);
    border-radius:8px;
    padding:1rem;
    cursor:pointer;
    display:flex;
    align-items:center;
}

.price-option input{
    margin-right:.5rem;
    accent-color:var(--primary);
}

.checkbox-group label{
    display:flex;
    align-items:center;
    gap:.6rem;
    font-weight:600;
}

.checkbox-group input{
    width:18px;
    height:18px;
    accent-color: var(--primary);
}

.button-group{
    display:flex;
    gap:1rem;
    margin-top:2rem;
}

.btn-submit{
    background:linear-gradient(135deg,#c70033,#8b0024);
    color:#fff;
    border:none;
    border-radius:14px;
    font-weight:600;
    font-size:16px;
    padding:1rem 1.2rem;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:all .3s ease;
    box-shadow:0 10px 30px rgba(199,0,51,0.3);
}

.btn-submit:hover{
    transform:translateY(-4px);
    box-shadow:0 15px 35px rgba(199,0,51,0.4);
}

.btn-submit::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,0.3),
        transparent
    );
    transition:.6s;
}

.btn-submit:hover::after{
    left:100%;
}

.footer{
    text-align:center;
    padding:2rem;
    background:#2c3e50;
    color:#fff;
    margin-top:3rem;
}

@media (max-width:768px){
    .form-row{
        grid-template-columns:1fr;
    }

    .form-section{
        padding:1.5rem;
    }
}

</style>
</head>

<body>

<div class="header">
<h1>Termo de Acordo Comercial</h1>
</div>

<div class="container">
<div class="form-section">
<h2>Formulário</h2>

<form id="termoForm">

<h3>Dados Pessoais</h3>

<div class="form-row">
<div class="form-group">
<label>Nome Completo *</label>
<input type="text" id="fullName" required placeholder="Digite seu nome completo">
</div>
<div class="form-group">
<label>CPF *</label>
<input type="text" id="cpf" required placeholder="000.000.000-00">
</div>
</div>

<div class="form-row">
<div class="form-group">
<label>Telefone *</label>
<input type="tel" id="phone" required placeholder="(00) 00000-0000">
</div>
<div class="form-group">
<label>E-mail *</label>
<input type="email" id="email" required placeholder="seu.email@exemplo.com">
</div>
</div>

<h3>Período de Isenção</h3>

<div class="form-row">
<div class="form-group">
<label>Data de Início *</label>
<input type="date" id="exemptionStartDate" value="2026-01-10" readonly>
</div>
<div class="form-group">
<label>Data de Término *</label>
<input type="date" id="exemptionEndDate" value="2026-06-30" readonly>
</div>
</div>

<h3>Valores Após 6 Meses</h3>

<div class="price-options">
<label class="price-option">
<input type="radio" name="priceOption" value="49.90" required>R$ 49,90
</label>
<label class="price-option">
<input type="radio" name="priceOption" value="99.90">R$ 99,90
</label>
<label class="price-option">
<input type="radio" name="priceOption" value="169.90">R$ 169,90
</label>
</div>

<div class="form-group">
<label>Forma de Pagamento *</label>
<select id="paymentMethod" required>
<option value="">Selecione</option>
<option>Cartão de Crédito</option>
<option>Boleto Bancário</option>
<option>Transferência Bancária</option>
<option>PIX</option>
</select>
</div>

<div class="form-group">
<label>Dia do Pagamento *</label>
<select id="paymentDay" required>
<option value="">Selecione o dia</option>
</select>
</div>

<div class="form-group checkbox-group">
<label>
<input type="checkbox" id="confirmData" required>
CONFIRMO QUE OS DADOS FORNECIDOS ESTÃO CORRETOS
</label>
</div>

<div class="form-group checkbox-group">
<label>
<input type="checkbox" id="confirmTerm" required>
CONFIRMO O ACEITE DO TERMO ACIMA
</label>
</div>

<div class="button-group">
<button type="button" id="submitBtn" class="btn-submit">Gerar PDF</button>
</div>

</form>
</div>
</div>

<div class="footer">
<p>&copy; 2026 Todos os direitos reservados.</p>
</div>

<script>

function formatDateBR(dateString){
    const [year,month,day]=dateString.split("-");
    return `${day}/${month}/${year}`;
}

function formatCurrency(value){
    return parseFloat(value).toLocaleString('pt-BR',{minimumFractionDigits:2});
}

// gerar dias 1 a 31
const paymentDaySelect = document.getElementById("paymentDay");
for (let i = 1; i <= 31; i++) {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = i;
    paymentDaySelect.appendChild(option);
}

async function obterIP() {
    try {
        const response = await fetch("https://api.ipify.org?format=json");
        const data = await response.json();
        return data.ip;
    } catch (error) {
        console.warn("Não foi possível obter o IP.");
        return "IP não identificado";
    }
}

document.getElementById("submitBtn").addEventListener("click", async function(){

    const form = document.getElementById("termoForm");

    if(!form.checkValidity()){
        form.reportValidity();
        return;
    }

    // 🔹 pegar IP
    const ip = await obterIP();

    // 🔹 pegar dados (APENAS UMA VEZ)
    const fullName = document.getElementById("fullName").value;
    const cpf = document.getElementById("cpf").value;
    const phone = document.getElementById("phone").value;
    const email = document.getElementById("email").value;
    const start = formatDateBR(document.getElementById("exemptionStartDate").value);
    const end = formatDateBR(document.getElementById("exemptionEndDate").value);
    const price = formatCurrency(document.querySelector('input[name="priceOption"]:checked').value);
    const paymentMethod = document.getElementById("paymentMethod").value;
    const paymentDay = document.getElementById("paymentDay").value;
    const confirmData = document.getElementById("confirmData").checked;
    const confirmTerm = document.getElementById("confirmTerm").checked;
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();

    let y=20;

    // 🔹 TENTA CARREGAR LOGO
    const logoBase64 = await carregarLogo("https://justi-a-em-dia.vercel.app/img/logo.justica-em-dia.png");

    if(logoBase64){
        doc.addImage(logoBase64,"PNG",55,10,100,30);
        y=50;
    }

    doc.setFontSize(14);
    doc.setTextColor(199,0,51);
    doc.text("TERMO DE ACORDO COMERCIAL",105,y,{align:"center"});
    y+=15;

    doc.setFontSize(10);
    doc.setTextColor(0,0,0);

    doc.text(`Nome completo: ${fullName}`,15,y); y+=6;
    doc.text(`CPF: ${cpf}`,15,y); y+=6;
    doc.text(`Telefone: ${phone}`,15,y); y+=6;
    doc.text(`E-mail: ${email}`,15,y); y+=10;

    doc.text(`Período de isenção: ${start} até ${end}`,15,y); y+=6;
    doc.text(`Valor após 6 meses: R$ ${price}`,15,y); y+=6;
    doc.text(`Forma de pagamento: ${paymentMethod}`,15,y); y+=6;
    doc.text(`Pagamento todo dia ${paymentDay} de cada mês.`,15,y); y+=12;

    doc.setFontSize(11);
    doc.text("DECLARAÇÃO:",15,y); y+=8;

    if(confirmData){
        doc.text("X CONFIRMO QUE OS DADOS FORNECIDOS ESTÃO CORRETOS",15,y);
        y+=6;
    }

    if(confirmTerm){
        doc.text("X CONFIRMO O ACEITE DO TERMO DE ISENÇÃO",15,y);
        y+=6;
    }

 y += 25; // espaço maior antes da assinatura

// largura da página
const pageWidth = doc.internal.pageSize.getWidth();

// definir largura da linha
const lineWidth = 100; 
const lineXStart = (pageWidth - lineWidth) / 2;
const lineXEnd = lineXStart + lineWidth;

// linha centralizada
doc.line(lineXStart, y, lineXEnd, y);

y += 8;

// Nome centralizado
doc.setFontSize(11);
doc.text(fullName, pageWidth / 2, y, { align: "center" });

y += 6;

// CPF centralizado
doc.text(`CPF: ${cpf}`, pageWidth / 2, y, { align: "center" });

y += 6;

// Data e hora completas
const agora = new Date();
const dataHora = agora.toLocaleDateString('pt-BR') + 
                " às " + 
                agora.toLocaleTimeString('pt-BR');

doc.text(dataHora, pageWidth / 2, y, { align: "center" });

    y += 8;

doc.setFontSize(9);
doc.setTextColor(120,120,120);
doc.text(`IP do Dispositivo: ${ip}`, pageWidth / 2, y, { align: "center" });



    // 🔹 Pequeno delay para garantir download
    setTimeout(()=>{
        doc.save(`termo-de-isencao-${fullName.replace(/\s+/g,'-')}.pdf`);
    },100);

});


// 🔹 FUNÇÃO PROMISE PARA CARREGAR LOGO
function carregarLogo(url){
    return new Promise((resolve)=>{
        const img=new Image();
        img.crossOrigin="Anonymous";

        img.onload=function(){
            const canvas=document.createElement("canvas");
            canvas.width=this.width;
            canvas.height=this.height;
            const ctx=canvas.getContext("2d");
            ctx.drawImage(this,0,0);
            resolve(canvas.toDataURL("image/png"));
        };

        img.onerror=function(){
            console.warn("Logo não encontrada. PDF será gerado sem logo.");
            resolve(null);
        };

        img.src=url;
    });
}

</script>

</body>
</html>
