    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição Newsletter - Justiça em Dia</title>
    <meta name="description" content="Inscreva-se na newsletter do Justiça em Dia e receba as principais atualizações jurídicas diretamente no seu e-mail.">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="canonical" href="https://www.justicaemdia.com.br/nesletter">
    <meta name="robots" content="index">
    <link rel="icon" type="images/png" href="../img/favicon.png"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .subscription-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .subscription-card {
            background: #fff;
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card-header i {
            font-size: 3rem;
            color: #c41e3a;
            margin-bottom: 20px;
        }

        .card-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .card-header p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .subscription-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            text-align: left;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #444;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .input-group input:focus {
            outline: none;
            border-color: #c41e3a;
            background-color: #fff;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            text-align: left;
            margin-top: 10px;
        }

        .checkbox-group input {
            margin-top: 4px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.4;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #c41e3a;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #a01830;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(196, 30, 58, 0.3);
        }

        .submit-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #c41e3a;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #1a1a1a;
        }

        #message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media (max-width: 480px) {
            .subscription-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="subscription-wrapper">
        <div class="subscription-card">
            <div class="card-header">
                <i class="fas fa-paper-plane"></i>
                <h1>Fique por dentro!</h1>
                <p>Receba as principais notícias jurídicas e análises exclusivas diretamente no seu e-mail.</p>
            </div>

            <form id="subscriptionForm" class="subscription-form">
                <div class="input-group">
                    <label for="name">Nome:</label>
                    <input type="text" id="name" name="name" placeholder="Seu nome" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent">Aceito receber e-mails informativos e notificações do Justiça em Dia.</label>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Inscrever Agora</button>
            </form>

            <div id="message"></div>

            <a href=".." class="back-link"><i class="fas fa-arrow-left"></i> Voltar para o portal</a>
        </div>
    </div>

    <script>
        document.getElementById('subscriptionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const date = new Date().toLocaleString('pt-BR');

            // Feedback visual
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processando...';
            messageDiv.style.display = 'none';

            const FORMSPREE_URL = 'https://formspree.io/f/xzdayepv';

            const formData = {
                nome: name,
                email: email,
                data_inscricao: date,
                origem: 'Página de Inscrição Dedicada',
                aceite_termos: 'Sim'
            };

            try {
                const response = await fetch(FORMSPREE_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData),
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    messageDiv.textContent = 'Inscrição realizada com sucesso! Verifique seu e-mail em breve.';
                    messageDiv.className = 'success';
                    messageDiv.style.display = 'block';
                    this.reset();
                } else {
                    throw new Error('Erro ao enviar formulário');
                }
            } catch (error) {
                messageDiv.textContent = 'Ocorreu um erro. Por favor, tente novamente mais tarde.';
                messageDiv.className = 'error';
                messageDiv.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Inscrever Agora';
            }
        });
    </script>
       <script src="../js/newsletter-injector.js"></script>
</body>
</html>
