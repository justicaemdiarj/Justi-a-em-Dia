<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Newsletter</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }
        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
        }
        h1 {
            color: #c41e3a;
            margin: 0;
            font-size: 24px;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-primary {
            background-color: #c41e3a;
            color: white;
        }
        .btn-primary:hover {
            background-color: #a01729;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #f8f9fa;
            font-weight: 700;
            color: #666;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #fff5f6;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
            border: 1px solid #ffdce0;
        }
        .stat-number {
            display: block;
            font-size: 24px;
            font-weight: 700;
            color: #c41e3a;
        }
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header">
        <h1><i class="fas fa-users-cog"></i> Gestão de Newsletter</h1>
        <a href="index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Voltar ao Site</a>
    </div>

    <div class="stats">
        <div class="stat-card">
            <span class="stat-number" id="totalSubscribers">0</span>
            <span class="stat-label">Total de Inscritos</span>
        </div>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button onclick="exportToCSV()" class="btn btn-primary">
            <i class="fas fa-file-excel"></i> Baixar Planilha (CSV)
        </button>
        <button onclick="clearList()" class="btn btn-danger" style="margin-left: auto;">
            <i class="fas fa-trash"></i> Limpar Lista
        </button>
    </div>

    <div id="tableContainer">
        <table id="subscribersTable">
            <thead>
                <tr>
                    <th>E-mail</th>
                    <th>Data de Inscrição</th>
                </tr>
            </thead>
            <tbody id="subscribersList">
                <!-- Preenchido via JS -->
            </tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">
            <i class="fas fa-envelope-open" style="font-size: 48px; margin-bottom: 10px;"></i>
            <p>Nenhum inscrito encontrado até o momento.</p>
        </div>
    </div>
</div>

<script>
    function loadSubscribers() {
        const subscribers = JSON.parse(localStorage.getItem('newsletter_subscribers') || '[]');
        const listElement = document.getElementById('subscribersList');
        const emptyState = document.getElementById('emptyState');
        const table = document.getElementById('subscribersTable');
        const totalCount = document.getElementById('totalSubscribers');

        totalCount.textContent = subscribers.length;

        if (subscribers.length === 0) {
            listElement.innerHTML = '';
            table.style.display = 'none';
            emptyState.style.display = 'block';
            return;
        }

        table.style.display = 'table';
        emptyState.style.display = 'none';
        
        // Ordenar por data (mais recentes primeiro)
        subscribers.reverse();

        listElement.innerHTML = subscribers.map(s => `
            <tr>
                <td>${s.email}</td>
                <td>${s.date}</td>
            </tr>
        `).join('');
    }

    function exportToCSV() {
        const subscribers = JSON.parse(localStorage.getItem('newsletter_subscribers') || '[]');
        
        if (subscribers.length === 0) {
            alert('Não há inscritos para exportar.');
            return;
        }

        // Cabeçalho do CSV com BOM para Excel reconhecer caracteres especiais
        let csvContent = "\uFEFF"; 
        csvContent += "E-mail;Data de Inscrição\n";
        
        subscribers.forEach(s => {
            csvContent += `${s.email};${s.date}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "inscritos_newsletter_justica_em_dia.csv");
        document.body.appendChild(link);
        
        link.click();
        document.body.removeChild(link);
    }

    function clearList() {
        if (confirm('Tem certeza que deseja apagar todos os inscritos? Esta ação não pode ser desfeita.')) {
            localStorage.removeItem('newsletter_subscribers');
            loadSubscribers();
        }
    }

    // Carregar ao iniciar
    document.addEventListener('DOMContentLoaded', loadSubscribers);
</script>

</body>
</html>
